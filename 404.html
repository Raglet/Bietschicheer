<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="./images/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <title>Bietschimeile</title>

    <style>
      /* This file also serves as GitHub Pages' catch-all 404 page: any path
         with no matching real file (in particular /bar-<id>, the QR-code
         scan target) is served this content with the real URL still shown
         in the browser. Kept dependency-free (no Firebase) so a stamp scan
         is instant and works even with a weak connection at the festival –
         the scan counter for the admin tool is only queued here (see
         queueScan below) and written by the map page afterwards. */
      body {
        background-color: var(--hintergrund-neutral);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .scan-status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .scan-status__spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--hintergrund-hell);
        border-top-color: var(--primär-dunkel);
        border-radius: 50%;
        animation: scan-spin 0.8s linear infinite;
      }
      @keyframes scan-spin {
        to { transform: rotate(360deg); }
      }
      .scan-status__text {
        color: var(--primär-dunkel);
        font-weight: 600;
        margin: 0;
      }
      .scan-status__link {
        color: var(--sekundär-hell);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="scan-status" id="scanStatus">
      <div class="scan-status__spinner"></div>
      <p class="scan-status__text">Stämpl wird gsammlet…</p>
    </div>

    <script>
      const STORAGE_KEY = "bietschimeile.stamps";

      function loadStamps() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveStamps(stamps) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stamps));
      }

      // Only the last path segment matters, so this works regardless of the
      // GitHub Pages project subpath (e.g. /Bietschicheer/bar-<id>).
      const segments = location.pathname.split("/").filter(Boolean);
      const last = segments[segments.length - 1] || "";
      const match = /^bar-(.+)$/.exec(last);
      // Local testing (no Pages 404 fallback, e.g. Live Server): open
      // 404.html?bar=<id> directly – same flow as a real scan.
      const queryBar = new URLSearchParams(location.search).get("bar");
      const barId = match ? decodeURIComponent(match[1]) : queryBar;

      // Scan tracker: a stamp collected for the FIRST time on this device is
      // queued here and reported to Firestore (stampstats/<barId>) by the map
      // page right after the redirect – index.html already loads Firebase,
      // so this page stays dependency-free and the count survives a weak
      // connection (the queue is retried on every later page load). Admins
      // see the numbers in the "Stempel" tab.
      const PENDING_KEY = "bietschimeile.pendingScans";

      function queueScan(barId) {
        try {
          const raw = localStorage.getItem(PENDING_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          const queue = Array.isArray(parsed) ? parsed : [];
          queue.push({ barId, hour: hourKey() });
          localStorage.setItem(PENDING_KEY, JSON.stringify(queue));
        } catch {
          /* localStorage unavailable – no tracking, stamp still works */
        }
      }

      // Same "YYYY-MM-DD_HH" bucket scheme as the guest counter
      // (counter/counter.js), so the admin tool can reuse its hourly chart.
      function hourKey() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}`;
      }

      if (barId) {
        const stamps = loadStamps();
        if (!stamps.includes(barId)) {
          stamps.push(barId);
          saveStamps(stamps);
          queueScan(barId);
        }
        // Straight back to the map – its existing ?bar=<id> deep link
        // (script.js) already pans to that marker and opens its card/popup,
        // which now shows "✓ Stempel gesammelt" since the stamp is saved.
        location.replace("index.html?bar=" + encodeURIComponent(barId));
      } else {
        document.getElementById("scanStatus").innerHTML =
          '<p class="scan-status__text">Siitä nid gfundu.</p>' +
          '<a class="scan-status__link" href="index.html">Zrugg zur Charta</a>';
      }
    </script>
  </body>
</html>
